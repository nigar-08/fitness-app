server:
  port: 8083

spring:
  application:
    name: ai-service
  data:
    mongodb:
      uri: ${AI_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/fitnessrecommendation}}
      database: ${AI_MONGODB_DATABASE:fitnessrecommendation}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}


eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}


rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking


gemini:
  api:
    url: ${GEMINI_API_URL}
    key: ${GEMINI_API_KEY}
